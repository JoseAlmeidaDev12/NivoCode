
services:
  postgres:
    image: postgres:17
    container_name: nivocode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nivocode
      POSTGRES_USER: nivocode
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nivocode -d nivocode"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
